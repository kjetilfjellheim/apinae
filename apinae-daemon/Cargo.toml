[package]
name = "apinae-daemon"
version = "0.1.16"
edition = "2021"
description = "An application for testing apis."
license = "Apache 2.0"
repository = "https://github.com/kjetilfjellheim/apinae"
readme = "README.md"
keywords = ["monitoring", "agent", "health", "system"]
authors = ["Kjetil Fjellheim <kjetil@forgottendonkey.net>"]
categories = ["testing", "api"]

[dependencies]
apinae-lib = { path = "../apinae-lib" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
tokio = { version = "1.54.1", features = ["full"] }
regex = "1.13.1"
actix-web = { version = "4.18.1", features = ["rustls-0_23"] }
rustls = { version = "0.23.46", features = ["logging", "tls12"] }
rustls-pemfile = "2.2.0"
reqwest = { version = "0.13.5" }
log = "0.4.35"
env_logger = { version = "0.11.11"}

[dev-dependencies]
futures-util = "0.3.34"

[profile.release]
lto = true
