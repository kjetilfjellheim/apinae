[package]
name = "apinae-ui"
version = "0.1.16"
description = "UI for Apinae"
edition = "2021"

[lib]
name = "apinae_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
apinae-lib = { path = "../../apinae-lib" }
tauri = { version = "2.12.5", features = ["devtools"] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-dialog = "2.8.4"
tauri-plugin = "2.7.2"
tracing = "0.1.44"
tauri-plugin-devtools = "2.2.3"
